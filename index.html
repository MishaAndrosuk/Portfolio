    <!--
      Inter на власному хостингу: без стороннього CSS, який блокував рендер.
      Підмножини розділені через unicode-range — браузер тягне лише потрібні,
      тож latin-ext завантажиться тільки якщо на сторінці справді буде такий символ.
    -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      @font-face {
        font-family: 'Inter'; font-style: normal; font-weight: 400 700; font-display: swap;
        src: url('/fonts/inter-cyrillic.woff2') format('woff2');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: 'Inter'; font-style: normal; font-weight: 400 700; font-display: swap;
        src: url('/fonts/inter-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Inter'; font-style: normal; font-weight: 400 700; font-display: swap;
        src: url('/fonts/inter-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>

<body>
    <!--
      Netlify шукає форми, розбираючи HTML задеплоєного сайту. Форма з React
      зʼявляється лише після запуску JS, тож її статичну копію треба лишити тут —
      інакше сабміти нікуди не потраплять. Поля мають збігатися з тими,
      що надсилає ContactForm.tsx.
    -->
    <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
      <input type="hidden" name="subject" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
