[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 7 вимагає Node ^20.19 || >=22.12
  NODE_VERSION = "22"

# SPA-редірект навмисно не додано: маршрутизації на клієнті немає,
# усе живе на одній сторінці. Catch-all `/* /index.html 200` віддавав би
# код 200 на неіснуючі адреси — це soft-404, і пошуковики за це карають.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Сторінка повністю самодостатня: шрифти, зображення і скрипти — свої.
    # 'unsafe-inline' для стилів потрібен Emotion, який MUI використовує для CSS-in-JS.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"

# /static — вихід збірки, імена містять хеш вмісту, тож кешуємо назавжди
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /assets — статика без хешів (резюме, фото, маніфест). Добу кешу достатньо,
# щоб оновлене резюме дійшло до відвідувачів без ручного скидання кешу.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML має перевірятися щоразу, інакше користувач застрягне на старій збірці
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
