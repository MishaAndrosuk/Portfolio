<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Сторінку не знайдено — Андрощук Михайло</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- Статична сторінка без JS: має відкриватися, навіть якщо бандл не завантажився -->
  <style>
    @font-face {
      font-family: 'Inter'; font-style: normal; font-weight: 400 700; font-display: swap;
      src: url('/fonts/inter-cyrillic.woff2') format('woff2');
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: 'Inter'; font-style: normal; font-weight: 400 700; font-display: swap;
      src: url('/fonts/inter-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212, U+FEFF, U+FFFD;
    }
    :root { color-scheme: light dark; --bg:#F7F6F3; --ink:#2B2B2B; --muted:#6E6A63; --accent:#4A6FA5; --on-accent:#fff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#1B1A18; --ink:#EDEAE4; --muted:#8C877E; --accent:#8FAEDC; --on-accent:#14213A; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--ink);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 440px; text-align: center; }
    .code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: .75rem; letter-spacing: .12em; color: var(--accent); margin: 0 0 12px;
    }
    h1 { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.2rem); line-height: 1.15; letter-spacing: -.02em; margin: 0 0 12px; }
    p { color: var(--muted); line-height: 1.7; margin: 0 0 28px; }
    a {
      display: inline-block; padding: 11px 22px; border-radius: 10px;
      background: var(--accent); color: var(--on-accent);
      text-decoration: none; font-weight: 550;
      transition: opacity .2s cubic-bezier(.22,.61,.36,1);
    }
    a:hover { opacity: .88; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">ПОМИЛКА 404</p>
    <h1>Такої сторінки немає</h1>
    <p>Схоже, посилання застаріло або в адресі є помилка.</p>
    <a href="/">На головну</a>
  </main>
</body>
</html>
